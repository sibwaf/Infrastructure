apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "{{ .Chart.Name }}"
  labels:
    {{- include "labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "selectorLabels" . | nindent 6 }}
  replicas: 1
  strategy:
    type: "Recreate"
  template:
    metadata:
      labels:
        {{- include "selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ .Files.Get "resources/loki.yaml" | sha256sum | quote }}
    spec:
      volumes:
        - name: "config"
          configMap:
            name: "{{ .Chart.Name }}"
        - name: "data"
          persistentVolumeClaim:
            claimName: "{{ .Chart.Name }}"
      containers:
        - name: "{{ .Chart.Name }}"
          image: "grafana/loki:{{ .Chart.AppVersion }}"
          imagePullPolicy: "IfNotPresent"
          ports:
            - name: "http"
              containerPort: 3100
          volumeMounts:
            - name: "config"
              subPath: "loki.yaml"
              mountPath: "/etc/loki/local-config.yaml"
              readOnly: true
            - name: "data"
              mountPath: "/loki"
